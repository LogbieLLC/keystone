[package]
name = "keystone-core"
description = "Keystone core library: every CA rule, testable without a display."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
build = "build.rs"

[features]
default = []
# FR-01 AC2, SEC-03, SEC-19: network refusal, seccomp filter and binary
# self-check are compiled in only with this feature.
production = []
# Separate report job for tests that need an outside dependency that does not
# exist yet (TESTING.md TEST-10). These tests fail with "BLOCKED: ...".
blocked-tests = []

[dependencies]
openssl.workspace = true
openssl-sys.workspace = true
x509-cert.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
zeroize.workspace = true
rustix.workspace = true
seccompiler.workspace = true
thiserror.workspace = true

[dev-dependencies]
keystone-testkit.workspace = true
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
