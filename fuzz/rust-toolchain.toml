# Pinned fuzzing toolchain (cargo-fuzz needs nightly sanitizer support).
# Used by `cd fuzz && cargo fuzz ...`; the application itself is built with the
# stable pin in ../rust-toolchain.toml. Changing this file is ask-first (AGENT-02).
[toolchain]
channel = "nightly-2026-10-15"
components = ["rust-src", "llvm-tools-preview"]
profile = "minimal"
